name: Update PEA Portfolio & Deploy

on:
  schedule:
    # Exécution du lundi au vendredi à 19h00 CET (18h00 UTC)
    - cron: '0 18 * * 1-5'
  push:
    branches:
      - main
    paths:
      - 'transactions.csv'
      - 'update_portfolio.py'
      - 'index.html'
      - 'style.css'
      - 'app.js'
  workflow_dispatch: # Permet de lancer la mise à jour manuellement en 1 clic

# Permissions requises pour commit le JSON et déployer sur GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'portfolio-deploy'
  cancel-in-progress: false

jobs:
  update-portfolio:
    name: 📈 Update Portfolio Data
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Execute Portfolio Calculation
        run: |
          python update_portfolio.py

      - name: 💾 Commit & Push Updated Portfolio JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add portfolio_data.json
          # Commit uniquement s'il y a des changements
          if git diff --staged --quiet; then
            echo "Aucune modification détectée sur portfolio_data.json."
          else
            git commit -m "chore(data): auto-update portfolio_data.json [skip ci]"
            git push
          fi

      - name: 🌐 Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Static Artifacts for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
